name: ${COMPOSE_PROJECT_NAME:-happyro}
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
x-server: &server
  pull_policy: never
  image: ${HAPPYRO_SERVER_IMAGE:?Set HAPPYRO_SERVER_IMAGE}
  restart: unless-stopped
  logging: *logging
  environment: &server-environment
    HAPPYRO_SERVER_DB_HOST: database
    HAPPYRO_SERVER_DB_USERNAME: happyro
    HAPPYRO_SERVER_DB_NAME: happyro
    HAPPYRO_SERVER_LOG_DB_NAME: happyro_log
    HAPPYRO_SERVER_DB_PASSWORD: ${HAPPYRO_SERVER_DB_PASSWORD:?Set HAPPYRO_SERVER_DB_PASSWORD}
    HAPPYRO_SERVER_INTERSERVER_USERNAME: happyro_interserver
    HAPPYRO_SERVER_INTERSERVER_PASSWORD: ${HAPPYRO_SERVER_INTERSERVER_PASSWORD:?Set HAPPYRO_SERVER_INTERSERVER_PASSWORD}
    HAPPYRO_SERVER_PUBLIC_HOST: 127.0.0.1
    HAPPYRO_GAME_PUBLIC_URL: ${HAPPYRO_GAME_PUBLIC_URL:?Set HAPPYRO_GAME_PUBLIC_URL}
    HAPPYRO_GAME_CONTROL_TOKEN: ${HAPPYRO_GAME_CONTROL_TOKEN:?Set HAPPYRO_GAME_CONTROL_TOKEN}
  volumes:
    - type: bind
      source: ${HAPPYRO_CUSTOM_DIR:-./custom}/npc
      target: /opt/happyro/custom/npc
      read_only: true
      bind: {create_host_path: false}
    - type: bind
      source: ${HAPPYRO_CUSTOM_DIR:-./custom}/db
      target: /opt/rathena/db/import
      read_only: true
      bind: {create_host_path: false}
    - type: bind
      source: ${HAPPYRO_DATA_DIR:-./data}/control-socket
      target: /run/happyro
      bind: {create_host_path: false}
    - type: bind
      source: ${HAPPYRO_DATA_DIR:-./data}/server-settings
      target: /run/happyro-settings
      bind: {create_host_path: false}
    - type: bind
      source: ${HAPPYRO_DATA_DIR:-./data}/server-logs
      target: /opt/rathena/log
      bind: {create_host_path: false}
x-api: &api
  pull_policy: never
  image: ${HAPPYRO_API_IMAGE:?Set HAPPYRO_API_IMAGE}
  logging: *logging
  environment: &api-environment
    HAPPYRO_ADMIN_INITIAL_USERNAME: ${HAPPYRO_ADMIN_INITIAL_USERNAME-admin}
    HAPPYRO_ADMIN_INITIAL_PASSWORD: ${HAPPYRO_ADMIN_INITIAL_PASSWORD-admin}
    HAPPYRO_ADMIN_DEFAULT_CREDENTIALS_HINT_ENABLED: ${HAPPYRO_ADMIN_DEFAULT_CREDENTIALS_HINT_ENABLED:-false}
    HAPPYRO_TIMEZONE: ${HAPPYRO_TIMEZONE:-Asia/Shanghai}
    HAPPYRO_ADMIN_PUBLIC_URL: ${HAPPYRO_ADMIN_PUBLIC_URL:?Set HAPPYRO_ADMIN_PUBLIC_URL}
    HAPPYRO_API_TRUSTED_PROXIES: ${HAPPYRO_ADMIN_PROXY_IP:-172.30.81.2}
    HAPPYRO_ADMIN_PASSWORD_CHANGE_ENABLED: ${HAPPYRO_ADMIN_PASSWORD_CHANGE_ENABLED:-true}
    HAPPYRO_ADMIN_CSRF_ORIGIN_CHECK_ENABLED: ${HAPPYRO_ADMIN_CSRF_ORIGIN_CHECK_ENABLED:-false}
    HAPPYRO_API_ADMIN_DB_HOST: database
    HAPPYRO_API_ADMIN_DB_PORT: 3306
    HAPPYRO_API_ADMIN_DB_NAME: happyro_admin
    HAPPYRO_API_ADMIN_DB_USERNAME: happyro_admin
    HAPPYRO_API_ADMIN_DB_PASSWORD: ${HAPPYRO_API_ADMIN_DB_PASSWORD:?Set HAPPYRO_API_ADMIN_DB_PASSWORD}
    HAPPYRO_API_GAME_DB_HOST: database
    HAPPYRO_API_GAME_DB_PORT: 3306
    HAPPYRO_API_GAME_DB_NAME: happyro
    HAPPYRO_API_GAME_LOG_DB_NAME: happyro_log
    HAPPYRO_API_GAME_DB_USERNAME: happyro_admin
    HAPPYRO_API_GAME_DB_PASSWORD: ${HAPPYRO_API_ADMIN_DB_PASSWORD:?Set HAPPYRO_API_ADMIN_DB_PASSWORD}
    HAPPYRO_API_ITEM_IMAGE_DIR: /resources/catalog/items
    HAPPYRO_API_MONSTER_IMAGE_DIR: /resources/catalog/monsters
    HAPPYRO_API_MAP_INDEX_PATH: /opt/api/resources/map_index.txt
    HAPPYRO_API_GAME_CONTROL_UPSTREAM_URL: http://web-api:8889
    HAPPYRO_GAME_CONTROL_TOKEN: ${HAPPYRO_GAME_CONTROL_TOKEN:?Set HAPPYRO_GAME_CONTROL_TOKEN}
    HAPPYRO_API_BATTLE_CONFIG_PATH: /run/happyro-settings/battle_conf.txt
    HAPPYRO_ADMIN_SESSION_SECURE_COOKIE_ENABLED: ${HAPPYRO_ADMIN_SESSION_SECURE_COOKIE_ENABLED:-false}
  volumes:
    - type: bind
      source: ${HAPPYRO_CUSTOM_DIR:-./custom}
      target: /opt/happyro/custom
      read_only: true
      bind: {create_host_path: false}
    - type: bind
      source: ${HAPPYRO_DATA_DIR:-./data}/server-settings
      target: /run/happyro-settings
      bind: {create_host_path: false}
    - type: bind
      source: ${HAPPYRO_RESOURCE_DIR:-./resources}/catalog
      target: /resources/catalog
      read_only: true
      bind: {create_host_path: false}
    - type: bind
      source: ${HAPPYRO_RESOURCE_DIR:-./resources}/catalog/npcs
      target: /opt/api/resources/game-data/world/npcs
      read_only: true
      bind: {create_host_path: false}
    - type: bind
      source: ${HAPPYRO_RESOURCE_DIR:-./resources}/catalog/maps
      target: /opt/api/resources/game-data/world/maps
      read_only: true
      bind: {create_host_path: false}
    - type: bind
      source: ${HAPPYRO_RESOURCE_DIR:-./resources}/catalog/terrain
      target: /opt/api/resources/game-data/world/terrain
      read_only: true
      bind: {create_host_path: false}
services:
  database:
    container_name: happyro-database
    pull_policy: never
    image: ${HAPPYRO_DATABASE_IMAGE:?Set HAPPYRO_DATABASE_IMAGE}
    restart: unless-stopped
    logging: *logging
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: happyro
      MARIADB_USER: happyro
      MARIADB_PASSWORD: ${HAPPYRO_SERVER_DB_PASSWORD:?Set HAPPYRO_SERVER_DB_PASSWORD}
      HAPPYRO_SERVER_LOG_DB_NAME: happyro_log
      HAPPYRO_API_ADMIN_DB_PASSWORD: ${HAPPYRO_API_ADMIN_DB_PASSWORD:?Set HAPPYRO_API_ADMIN_DB_PASSWORD}
      HAPPYRO_SERVER_INTERSERVER_USERNAME: happyro_interserver
      HAPPYRO_SERVER_INTERSERVER_PASSWORD: ${HAPPYRO_SERVER_INTERSERVER_PASSWORD:?Set HAPPYRO_SERVER_INTERSERVER_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--skip-name-resolve"]
    volumes:
      - type: bind
        source: ${HAPPYRO_DATA_DIR:-./data}/database
        target: /var/lib/mysql
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 60
  login:
    <<: *server
    container_name: happyro-login
    command: [login-server]
    depends_on: {database: {condition: service_healthy}}
  char:
    <<: *server
    container_name: happyro-char
    command: [char-server]
    environment:
      <<: *server-environment
      HAPPYRO_CHARACTER_START_MODE: ${HAPPYRO_CHARACTER_START_MODE:-classic}
    depends_on: {login: {condition: service_healthy}}
  map:
    <<: *server
    container_name: happyro-map
    command: [map-server]
    environment:
      <<: *server-environment
      HAPPYRO_GAME_ENTITY_SYNC_RANGE_CELLS: ${HAPPYRO_GAME_ENTITY_SYNC_RANGE_CELLS:-}
      HAPPYRO_GAME_MAX_WALK_PATH_CELLS: ${HAPPYRO_GAME_MAX_WALK_PATH_CELLS:-}
      HAPPYRO_GAME_NAVIGATION_TELEPORT_POLICY: ${HAPPYRO_GAME_NAVIGATION_TELEPORT_POLICY:-}
      HAPPYRO_GAME_NAVIGATION_TELEPORT_CROSS_MAP_ENABLED: ${HAPPYRO_GAME_NAVIGATION_TELEPORT_CROSS_MAP_ENABLED:-}
      HAPPYRO_GAME_NAVIGATION_TELEPORT_COOLDOWN_SECONDS: ${HAPPYRO_GAME_NAVIGATION_TELEPORT_COOLDOWN_SECONDS:-}
      HAPPYRO_GAME_TOOLS_MONSTER_SPAWN_POLICY: ${HAPPYRO_GAME_TOOLS_MONSTER_SPAWN_POLICY:-}
      HAPPYRO_GAME_TOOLS_MONSTER_SPAWN_COOLDOWN_SECONDS: ${HAPPYRO_GAME_TOOLS_MONSTER_SPAWN_COOLDOWN_SECONDS:-}
      HAPPYRO_GAME_TOOLS_MONSTER_SPAWN_DURATION_SECONDS: ${HAPPYRO_GAME_TOOLS_MONSTER_SPAWN_DURATION_SECONDS:-}
      HAPPYRO_GAME_TOOLS_MONSTER_SPAWN_ALLOW_BOSS_ENABLED: ${HAPPYRO_GAME_TOOLS_MONSTER_SPAWN_ALLOW_BOSS_ENABLED:-}
      HAPPYRO_GAME_TOOLS_CHARACTER_MAINTENANCE_POLICY: ${HAPPYRO_GAME_TOOLS_CHARACTER_MAINTENANCE_POLICY:-}
      HAPPYRO_GAME_TOOLS_GAME_SETTINGS_POLICY: ${HAPPYRO_GAME_TOOLS_GAME_SETTINGS_POLICY:-}
      HAPPYRO_GAME_TOOLS_ITEM_GRANT_POLICY: ${HAPPYRO_GAME_TOOLS_ITEM_GRANT_POLICY:-}
      HAPPYRO_SERVER_CUSTOM_NPC_DIR: /opt/happyro/custom/npc
      HAPPYRO_GAME_BASE_EXP_RATE_PERCENT: "${HAPPYRO_GAME_BASE_EXP_RATE_PERCENT:-}"
      HAPPYRO_GAME_JOB_EXP_RATE_PERCENT: "${HAPPYRO_GAME_JOB_EXP_RATE_PERCENT:-}"
      HAPPYRO_GAME_ITEM_RATE_COMMON_PERCENT: "${HAPPYRO_GAME_ITEM_RATE_COMMON_PERCENT:-}"
      HAPPYRO_GAME_ITEM_RATE_COMMON_BOSS_PERCENT: "${HAPPYRO_GAME_ITEM_RATE_COMMON_BOSS_PERCENT:-}"
      HAPPYRO_GAME_ITEM_RATE_COMMON_MVP_PERCENT: "${HAPPYRO_GAME_ITEM_RATE_COMMON_MVP_PERCENT:-}"
      HAPPYRO_GAME_ITEM_RATE_HEAL_PERCENT: "${HAPPYRO_GAME_ITEM_RATE_HEAL_PERCENT:-}"
      HAPPYRO_GAME_ITEM_RATE_HEAL_BOSS_PERCENT: "${HAPPYRO_GAME_ITEM_RATE_HEAL_BOSS_PERCENT:-}"
      HAPPYRO_GAME_ITEM_RATE_HEAL_MVP_PERCENT: "${HAPPYRO_GAME_ITEM_RATE_HEAL_MVP_PERCENT:-}"
      HAPPYRO_GAME_ITEM_RATE_USE_PERCENT: "${HAPPYRO_GAME_ITEM_RATE_USE_PERCENT:-}"
      HAPPYRO_GAME_ITEM_RATE_USE_BOSS_PERCENT: "${HAPPYRO_GAME_ITEM_RATE_USE_BOSS_PERCENT:-}"
      HAPPYRO_GAME_ITEM_RATE_USE_MVP_PERCENT: "${HAPPYRO_GAME_ITEM_RATE_USE_MVP_PERCENT:-}"
      HAPPYRO_GAME_ITEM_RATE_EQUIP_PERCENT: "${HAPPYRO_GAME_ITEM_RATE_EQUIP_PERCENT:-}"
      HAPPYRO_GAME_ITEM_RATE_EQUIP_BOSS_PERCENT: "${HAPPYRO_GAME_ITEM_RATE_EQUIP_BOSS_PERCENT:-}"
      HAPPYRO_GAME_ITEM_RATE_EQUIP_MVP_PERCENT: "${HAPPYRO_GAME_ITEM_RATE_EQUIP_MVP_PERCENT:-}"
      HAPPYRO_GAME_ITEM_RATE_CARD_PERCENT: "${HAPPYRO_GAME_ITEM_RATE_CARD_PERCENT:-}"
      HAPPYRO_GAME_ITEM_RATE_CARD_BOSS_PERCENT: "${HAPPYRO_GAME_ITEM_RATE_CARD_BOSS_PERCENT:-}"
      HAPPYRO_GAME_ITEM_RATE_CARD_MVP_PERCENT: "${HAPPYRO_GAME_ITEM_RATE_CARD_MVP_PERCENT:-}"
      HAPPYRO_GAME_REFINE_CHANCE_RATE_PERCENT: "${HAPPYRO_GAME_REFINE_CHANCE_RATE_PERCENT:-}"
      HAPPYRO_GAME_GRADE_CHANCE_RATE_PERCENT: "${HAPPYRO_GAME_GRADE_CHANCE_RATE_PERCENT:-}"
      HAPPYRO_GAME_REFINE_ALWAYS_SUCCESS_ENABLED: "${HAPPYRO_GAME_REFINE_ALWAYS_SUCCESS_ENABLED:-}"
      HAPPYRO_GAME_GRADE_ALWAYS_SUCCESS_ENABLED: "${HAPPYRO_GAME_GRADE_ALWAYS_SUCCESS_ENABLED:-}"
      HAPPYRO_GAME_NAVIGATION_MAP_CHANNELS_ENABLED: "${HAPPYRO_GAME_NAVIGATION_MAP_CHANNELS_ENABLED:-}"
    depends_on: {char: {condition: service_healthy}}
  web-api:
    <<: *server
    container_name: happyro-web-api
    command: [web-server]
    depends_on: {map: {condition: service_healthy}}
  api-init:
    <<: *api
    container_name: happyro-api-init
    command: [initialize]
    restart: "no"
    depends_on: {database: {condition: service_healthy}}
  api:
    <<: *api
    container_name: happyro-api
    environment:
      <<: *api-environment
      HAPPYRO_REGISTRATION_DEFAULT_GROUP_ID: "${HAPPYRO_REGISTRATION_DEFAULT_GROUP_ID:-}"
      HAPPYRO_REGISTRATION_DEFAULT_GROUP_EDITABLE: ${HAPPYRO_REGISTRATION_DEFAULT_GROUP_EDITABLE:-true}
    networks: [default, admin-proxy]
    restart: unless-stopped
    depends_on: {api-init: {condition: service_completed_successfully}, web-api: {condition: service_healthy}}
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/api/health]
      interval: 10s
      timeout: 5s
      retries: 30
  admin:
    container_name: happyro-admin
    networks:
      admin-proxy:
        ipv4_address: ${HAPPYRO_ADMIN_PROXY_IP:-172.30.81.2}
    pull_policy: never
    image: ${HAPPYRO_ADMIN_IMAGE:?Set HAPPYRO_ADMIN_IMAGE}
    restart: unless-stopped
    logging: *logging
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["${HAPPYRO_ADMIN_PUBLISH_ADDRESS:-8000}:8080"]
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 5s
      retries: 30
  gateway:
    container_name: happyro-gateway
    pull_policy: never
    image: ${HAPPYRO_GATEWAY_IMAGE:?Set HAPPYRO_GATEWAY_IMAGE}
    restart: unless-stopped
    logging: *logging
    environment:
      HAPPYRO_GATEWAY_LISTEN_PORT: 3338
      HAPPYRO_GAME_PUBLIC_URL: ${HAPPYRO_GAME_PUBLIC_URL:?Set HAPPYRO_GAME_PUBLIC_URL}
      HAPPYRO_CLIENT_SOCKET_PROXY_URL: ${HAPPYRO_CLIENT_SOCKET_PROXY_URL:-}
      HAPPYRO_GATEWAY_GAME_WEB_UPSTREAM_URL: http://web-api:8889
      HAPPYRO_TIMEZONE: ${HAPPYRO_TIMEZONE:-Asia/Shanghai}
      HAPPYRO_CLIENT_DEFAULT_CAMERA_DESKTOP_ZOOM: ${HAPPYRO_CLIENT_DEFAULT_CAMERA_DESKTOP_ZOOM:-}
      HAPPYRO_CLIENT_DEFAULT_CAMERA_PHONE_LANDSCAPE_ZOOM: ${HAPPYRO_CLIENT_DEFAULT_CAMERA_PHONE_LANDSCAPE_ZOOM:-}
      HAPPYRO_CLIENT_DEFAULT_CAMERA_PHONE_PORTRAIT_ZOOM: ${HAPPYRO_CLIENT_DEFAULT_CAMERA_PHONE_PORTRAIT_ZOOM:-}
      HAPPYRO_CLIENT_DEFAULT_CAMERA_TABLET_LANDSCAPE_ZOOM: ${HAPPYRO_CLIENT_DEFAULT_CAMERA_TABLET_LANDSCAPE_ZOOM:-}
      HAPPYRO_CLIENT_DEFAULT_CAMERA_TABLET_PORTRAIT_ZOOM: ${HAPPYRO_CLIENT_DEFAULT_CAMERA_TABLET_PORTRAIT_ZOOM:-}
      HAPPYRO_CLIENT_DEFAULT_CAMERA_SMOOTH_ENABLED: ${HAPPYRO_CLIENT_DEFAULT_CAMERA_SMOOTH_ENABLED:-}
      HAPPYRO_CLIENT_DEFAULT_AUTO_COMBAT_SEARCH_RANGE: ${HAPPYRO_CLIENT_DEFAULT_AUTO_COMBAT_SEARCH_RANGE:-}
      HAPPYRO_CLIENT_DEFAULT_AUTO_COMBAT_ACTIVITY_RANGE: ${HAPPYRO_CLIENT_DEFAULT_AUTO_COMBAT_ACTIVITY_RANGE:-}
      HAPPYRO_CLIENT_DEFAULT_AUTO_TELEPORT_ENABLED: ${HAPPYRO_CLIENT_DEFAULT_AUTO_TELEPORT_ENABLED:-}
      HAPPYRO_CLIENT_DEFAULT_AUTO_TELEPORT_WAIT_SECONDS: ${HAPPYRO_CLIENT_DEFAULT_AUTO_TELEPORT_WAIT_SECONDS:-}
      HAPPYRO_CLIENT_DEFAULT_AUTO_TELEPORT_INTERVAL_SECONDS: ${HAPPYRO_CLIENT_DEFAULT_AUTO_TELEPORT_INTERVAL_SECONDS:-}
      HAPPYRO_CLIENT_DEFAULT_AUTO_RECOVERY_HP_TRIGGER_PERCENT: ${HAPPYRO_CLIENT_DEFAULT_AUTO_RECOVERY_HP_TRIGGER_PERCENT:-}
      HAPPYRO_CLIENT_DEFAULT_AUTO_RECOVERY_HP_TARGET_PERCENT: ${HAPPYRO_CLIENT_DEFAULT_AUTO_RECOVERY_HP_TARGET_PERCENT:-}
      HAPPYRO_CLIENT_DEFAULT_AUTO_RECOVERY_SP_TRIGGER_PERCENT: ${HAPPYRO_CLIENT_DEFAULT_AUTO_RECOVERY_SP_TRIGGER_PERCENT:-}
      HAPPYRO_CLIENT_DEFAULT_AUTO_RECOVERY_SP_TARGET_PERCENT: ${HAPPYRO_CLIENT_DEFAULT_AUTO_RECOVERY_SP_TARGET_PERCENT:-}
      HAPPYRO_CLIENT_DEFAULT_AUTO_PICKUP_ENABLED: ${HAPPYRO_CLIENT_DEFAULT_AUTO_PICKUP_ENABLED:-}
      HAPPYRO_CLIENT_DEFAULT_AUTO_PICKUP_RANGE: ${HAPPYRO_CLIENT_DEFAULT_AUTO_PICKUP_RANGE:-}
      HAPPYRO_CLIENT_DEFAULT_AUTO_PICKUP_BATCH_SECONDS: ${HAPPYRO_CLIENT_DEFAULT_AUTO_PICKUP_BATCH_SECONDS:-}
      HAPPYRO_CLIENT_DEFAULT_AUTO_PICKUP_CATEGORIES: ${HAPPYRO_CLIENT_DEFAULT_AUTO_PICKUP_CATEGORIES:-}
      HAPPYRO_CLIENT_DEFAULT_GRAPHICS_QUALITY: ${HAPPYRO_CLIENT_DEFAULT_GRAPHICS_QUALITY:-}
      HAPPYRO_CLIENT_DEFAULT_GRAPHICS_FPS_LIMIT: ${HAPPYRO_CLIENT_DEFAULT_GRAPHICS_FPS_LIMIT:-}
      HAPPYRO_CLIENT_DEFAULT_GRAPHICS_PERFORMANCE_MODE_ENABLED: ${HAPPYRO_CLIENT_DEFAULT_GRAPHICS_PERFORMANCE_MODE_ENABLED:-}
      HAPPYRO_CLIENT_DEFAULT_GRAPHICS_VIEW_AREA: ${HAPPYRO_CLIENT_DEFAULT_GRAPHICS_VIEW_AREA:-}
      HAPPYRO_CLIENT_DEFAULT_GRAPHICS_CURSOR_ENABLED: ${HAPPYRO_CLIENT_DEFAULT_GRAPHICS_CURSOR_ENABLED:-}
      HAPPYRO_CLIENT_DEFAULT_GRAPHICS_PIXEL_PERFECT_SPRITES_ENABLED: ${HAPPYRO_CLIENT_DEFAULT_GRAPHICS_PIXEL_PERFECT_SPRITES_ENABLED:-}
      HAPPYRO_CLIENT_DEFAULT_GRAPHICS_BLOOM_ENABLED: ${HAPPYRO_CLIENT_DEFAULT_GRAPHICS_BLOOM_ENABLED:-}
      HAPPYRO_CLIENT_DEFAULT_GRAPHICS_BLUR_ENABLED: ${HAPPYRO_CLIENT_DEFAULT_GRAPHICS_BLUR_ENABLED:-}
      HAPPYRO_CLIENT_DEFAULT_GRAPHICS_FXAA_ENABLED: ${HAPPYRO_CLIENT_DEFAULT_GRAPHICS_FXAA_ENABLED:-}
      HAPPYRO_CLIENT_DEFAULT_GRAPHICS_VIBRANCE_ENABLED: ${HAPPYRO_CLIENT_DEFAULT_GRAPHICS_VIBRANCE_ENABLED:-}
      HAPPYRO_CLIENT_DEFAULT_GRAPHICS_CARTOON_ENABLED: ${HAPPYRO_CLIENT_DEFAULT_GRAPHICS_CARTOON_ENABLED:-}
      HAPPYRO_CLIENT_DEFAULT_GRAPHICS_CAS_ENABLED: ${HAPPYRO_CLIENT_DEFAULT_GRAPHICS_CAS_ENABLED:-}
      HAPPYRO_CLIENT_DEFAULT_GRAPHICS_BLOOM_INTENSITY: ${HAPPYRO_CLIENT_DEFAULT_GRAPHICS_BLOOM_INTENSITY:-}
      HAPPYRO_CLIENT_DEFAULT_GRAPHICS_BLUR_AREA: ${HAPPYRO_CLIENT_DEFAULT_GRAPHICS_BLUR_AREA:-}
      HAPPYRO_CLIENT_DEFAULT_GRAPHICS_BLUR_INTENSITY: ${HAPPYRO_CLIENT_DEFAULT_GRAPHICS_BLUR_INTENSITY:-}
      HAPPYRO_CLIENT_DEFAULT_GRAPHICS_FXAA_EDGE_THRESHOLD: ${HAPPYRO_CLIENT_DEFAULT_GRAPHICS_FXAA_EDGE_THRESHOLD:-}
      HAPPYRO_CLIENT_DEFAULT_GRAPHICS_VIBRANCE: ${HAPPYRO_CLIENT_DEFAULT_GRAPHICS_VIBRANCE:-}
      HAPPYRO_CLIENT_DEFAULT_GRAPHICS_CARTOON_POWER: ${HAPPYRO_CLIENT_DEFAULT_GRAPHICS_CARTOON_POWER:-}
      HAPPYRO_CLIENT_DEFAULT_GRAPHICS_CARTOON_EDGE_SLOPE: ${HAPPYRO_CLIENT_DEFAULT_GRAPHICS_CARTOON_EDGE_SLOPE:-}
      HAPPYRO_CLIENT_DEFAULT_GRAPHICS_CAS_CONTRAST: ${HAPPYRO_CLIENT_DEFAULT_GRAPHICS_CAS_CONTRAST:-}
      HAPPYRO_CLIENT_DEFAULT_GRAPHICS_CAS_SHARPENING: ${HAPPYRO_CLIENT_DEFAULT_GRAPHICS_CAS_SHARPENING:-}
      HAPPYRO_CLIENT_DEFAULT_BGM_ENABLED: ${HAPPYRO_CLIENT_DEFAULT_BGM_ENABLED:-}
      HAPPYRO_CLIENT_DEFAULT_BGM_VOLUME: ${HAPPYRO_CLIENT_DEFAULT_BGM_VOLUME:-}
      HAPPYRO_CLIENT_DEFAULT_SOUND_ENABLED: ${HAPPYRO_CLIENT_DEFAULT_SOUND_ENABLED:-}
      HAPPYRO_CLIENT_DEFAULT_SOUND_VOLUME: ${HAPPYRO_CLIENT_DEFAULT_SOUND_VOLUME:-}
      HAPPYRO_CLIENT_DEFAULT_TOAST_DURATION_SECONDS: ${HAPPYRO_CLIENT_DEFAULT_TOAST_DURATION_SECONDS:-}
      HAPPYRO_CLIENT_DEFAULT_CHAT_PREVIEW_COMPACT_LINES: ${HAPPYRO_CLIENT_DEFAULT_CHAT_PREVIEW_COMPACT_LINES:-}
      HAPPYRO_CLIENT_DEFAULT_CHAT_PREVIEW_SPACIOUS_LINES: ${HAPPYRO_CLIENT_DEFAULT_CHAT_PREVIEW_SPACIOUS_LINES:-}
      HAPPYRO_CLIENT_DEFAULT_CHAT_PREVIEW_TABS_ENABLED: ${HAPPYRO_CLIENT_DEFAULT_CHAT_PREVIEW_TABS_ENABLED:-}
      HAPPYRO_CLIENT_DEFAULT_MAP_FOG_ENABLED: ${HAPPYRO_CLIENT_DEFAULT_MAP_FOG_ENABLED:-}
      HAPPYRO_CLIENT_DEFAULT_MAP_LIGHTMAP_ENABLED: ${HAPPYRO_CLIENT_DEFAULT_MAP_LIGHTMAP_ENABLED:-}
      HAPPYRO_CLIENT_DEFAULT_MAP_EFFECTS_ENABLED: ${HAPPYRO_CLIENT_DEFAULT_MAP_EFFECTS_ENABLED:-}
      HAPPYRO_CLIENT_DEFAULT_MAP_MIN_EFFECTS_ENABLED: ${HAPPYRO_CLIENT_DEFAULT_MAP_MIN_EFFECTS_ENABLED:-}
      HAPPYRO_CLIENT_DEFAULT_MAP_SHOW_MISS_ENABLED: ${HAPPYRO_CLIENT_DEFAULT_MAP_SHOW_MISS_ENABLED:-}
      HAPPYRO_CLIENT_DEFAULT_MAP_NAME_STYLE_ENABLED: ${HAPPYRO_CLIENT_DEFAULT_MAP_NAME_STYLE_ENABLED:-}
      HAPPYRO_CLIENT_DEFAULT_MAP_SMOOTH_LIGHT_MODE: ${HAPPYRO_CLIENT_DEFAULT_MAP_SMOOTH_LIGHT_MODE:-}
      HAPPYRO_CLIENT_DEFAULT_MAP_AURA_MODE: ${HAPPYRO_CLIENT_DEFAULT_MAP_AURA_MODE:-}
      HAPPYRO_CLIENT_DEFAULT_SCRIPT_TEXT_MIN_CONTRAST: ${HAPPYRO_CLIENT_DEFAULT_SCRIPT_TEXT_MIN_CONTRAST:-}
      HAPPYRO_GATEWAY_API_UPSTREAM_URL: http://api:8080
      HAPPYRO_GATEWAY_WS_ALLOWED_TARGETS: 127.0.0.1:6900,127.0.0.1:6121,127.0.0.1:5121
      HAPPYRO_GATEWAY_WS_TARGET_REDIRECTS: 127.0.0.1:6900=login:6900,127.0.0.1:6121=char:6121,127.0.0.1:5121=map:5121
      HAPPYRO_GATEWAY_CUSTOM_RESOURCE_DIR: /opt/happyro/custom/resources
      HAPPYRO_GATEWAY_RESOURCE_OVERRIDE_DIRS: /opt/overrides:/resources/kro-20211105:/resources/kro-20211105/data
    volumes:
      - type: bind
        source: ${HAPPYRO_CUSTOM_DIR:-./custom}/resources
        target: /opt/happyro/custom/resources
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${HAPPYRO_RESOURCE_DIR:-./resources}
        target: /resources
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${HAPPYRO_DATA_DIR:-./data}/gateway-logs
        target: /opt/gateway/logs
        bind: {create_host_path: false}
    ports: ["${HAPPYRO_GATEWAY_PUBLISH_ADDRESS:-3338}:3338"]
    depends_on: {web-api: {condition: service_healthy}}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3338/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30

networks:
  default: {}
  admin-proxy:
    ipam:
      config:
        - subnet: ${HAPPYRO_ADMIN_PROXY_SUBNET:-172.30.81.0/29}
          ip_range: ${HAPPYRO_ADMIN_PROXY_DYNAMIC_RANGE:-172.30.81.4/30}
