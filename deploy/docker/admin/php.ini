; HappyRO Admin PHP runtime settings.
; The official php:8.4-fpm image ships no php.ini, so without this file PHP falls
; back to its built-in defaults (memory_limit=128M) and OPcache stays unconfigured.
memory_limit = 256M
max_execution_time = 60
post_max_size = 12M
upload_max_filesize = 12M
expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
