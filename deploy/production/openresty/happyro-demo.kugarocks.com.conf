server {
    listen 10.8.0.1:80;
    server_name happyro-demo.kugarocks.com;
    return 301 https://$host$request_uri;
}

server {
    listen 10.8.0.1:443 ssl;
    server_name happyro-demo.kugarocks.com;

    ssl_certificate /root/.acme.sh/kugarocks.com_ecc/fullchain.cer;
    ssl_certificate_key /root/.acme.sh/kugarocks.com_ecc/kugarocks.com.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /ws/ {
        proxy_pass http://127.0.0.1:3338;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3338;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    access_log /var/log/openresty/happyro-demo.kugarocks.com.access.log;
    error_log /var/log/openresty/happyro-demo.kugarocks.com.error.log;
}
