services:
  database:
    image: ${MARIADB_IMAGE}
    container_name: happyro-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${HAPPYRO_SERVER_DB_NAME}
      MARIADB_USER: ${HAPPYRO_SERVER_DB_USERNAME}
      MARIADB_PASSWORD: ${HAPPYRO_SERVER_DB_PASSWORD}
      HAPPYRO_SERVER_LOG_DB_NAME: ${HAPPYRO_SERVER_LOG_DB_NAME}
      HAPPYRO_SERVER_INTERSERVER_USERNAME: ${HAPPYRO_SERVER_INTERSERVER_USERNAME}
      HAPPYRO_SERVER_INTERSERVER_PASSWORD: ${HAPPYRO_SERVER_INTERSERVER_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
    ports:
      - ${HAPPYRO_DATABASE_PUBLISH_HOST}:${HAPPYRO_SERVER_DB_PORT}:3306
    volumes:
      - ${HAPPYRO_DATABASE_DATA_DIR}:/var/lib/mysql
      - ${HAPPYRO_SERVER_SQL_DIR}:/opt/rathena/sql:ro
      - ./init/20-happyro-databases.sh:/docker-entrypoint-initdb.d/20-happyro-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MARIADB_PASSWORD mariadb-admin ping --host=127.0.0.1 --user=$$MARIADB_USER --silent"]
      interval: 2s
      timeout: 5s
      retries: 60
    restart: unless-stopped
