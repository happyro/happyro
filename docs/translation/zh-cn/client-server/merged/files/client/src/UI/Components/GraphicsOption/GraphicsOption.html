<div id="GraphicsOption">
	<div class="titlebar" data-background="basic_interface/titlebar_mid.bmp">
		<div class="left">
			<button
				class="base"
				data-background="basic_interface/sys_base_off.bmp"
				data-hover="basic_interface/sys_base_on.bmp"
			></button>
			<span class="text" data-text="1484">图形设置</span>
		</div>
		<div class="right">
			<button
				class="base close"
				data-background="basic_interface/sys_close_off.bmp"
				data-hover="basic_interface/sys_close_on.bmp"
			></button>
		</div>
		<div class="clear"></div>
	</div>

	<div class="tabs-container">
		<div class="tabs">
			<button class="tab-button selected" data-tab="basic">基础</button>
			<button class="tab-button" data-tab="advanced">高级</button>
		</div>
	</div>

	<div class="panel">
		<div class="tab-content selected" id="basic">
			<table>
				<tr>
					<td>详情</td>
					<td style="display: inline-block; width: 260px">
						<input
							class="details"
							type="range"
							value="100"
							max="100"
							min="25"
							step="5"
							style="width: 90%"
						/>
					</td>
				</tr>
				<tr class="resolution">
					<td>分辨率</td>
					<td>
						<select class="screensize">
							<option value="650x480">640 x 480</option>
							<option value="800x600">800 x 600</option>
							<option value="1024x768">1024 x 768</option>
							<option value="1280x800">1280 x 800</option>
							<option value="1400x900">1400 x 900</option>
							<option value="1680x1050">1680 x 1050</option>
							<option value="full">全屏</option>
						</select>
					</td>
				</tr>
				<tr>
					<td>光标</td>
					<td>
						<label>
							<input class="cursor-option" type="checkbox" />
							Show official cursor
						</label>
					</td>
				</tr>
				<tr>
					<td>帧率上限</td>
					<td>
						<select class="fpslimit">
							<option value="-1">无限制</option>
							<option value="30">30</option>
							<option value="60">60</option>
							<option value="90">90</option>
							<option value="120">120</option>
						</select>
					</td>
				</tr>
				<tr>
					<td>显示帧率</td>
					<td>
						<label>
							<input class="fps" type="checkbox" />
						</label>
					</td>
				</tr>
			</table>
		</div>

		<div class="tab-content" id="advanced">
			<table>
				<tr>
					<td title="Force nearest neighbor filtering for pixel-perfect sprite rendering">
						像素完美精灵
					</td>
					<td>
						<label>
							<input class="pixel-perfect" type="checkbox" />
							强制使用最近邻过滤
						</label>
					</td>
				</tr>
				<tr>
					<td title="为明亮区域添加发光效果">泛光</td>
					<td>
						<label style="display: inline-block; margin-right: 20px">
							<input class="bloom" type="checkbox" />
						</label>
						<label style="display: inline-block; width: 200px">
							强度：
							<input
								class="bloom-intensity"
								type="range"
								value="0.5"
								min="0.1"
								max="3.0"
								step="0.05"
								style="width: 90%; vertical-align: middle"
							/>
						</label>
					</td>
				</tr>
				<tr>
					<td title="对屏幕应用模糊效果">模糊</td>
					<td>
						<label style="display: inline-block; margin-right: 20px">
							<input class="blur" type="checkbox" />
						</label>
						<label style="display: inline-block; width: 90px">
							强度：
							<input
								class="blur-intensity"
								type="range"
								value="3.0"
								min="2.0"
								max="10.0"
								step="0.1"
								style="width: 90%; vertical-align: middle"
							/>
						</label>
						<label style="display: inline-block; width: 90px">
							区域：
							<input
								class="blur-area"
								type="range"
								value="14.0"
								min="3.0"
								max="20.0"
								step="1.0"
								style="width: 90%; vertical-align: middle"
							/>
						</label>
					</td>
				</tr>
				<tr>
					<td title="通过对比度自适应锐化增强细节">对比度自适应锐化（CAS）</td>
					<td>
						<label style="display: inline-block; margin-right: 20px">
							<input class="casEnabled" type="checkbox" />
						</label>
						<label style="display: inline-block; width: 90px">
							对比度：
							<input
								class="casContrast"
								type="range"
								value="0.0"
								min="0.0"
								max="1.0"
								step="0.05"
								style="width: 90%; vertical-align: middle"
							/>
						</label>
						<label style="display: inline-block; width: 90px">
							锐化：
							<input
								class="casSharpening"
								type="range"
								value="1.0"
								min="0.0"
								max="1.0"
								step="0.05"
								style="width: 90%; vertical-align: middle"
							/>
						</label>
					</td>
				</tr>
				<tr>
					<td title="快速近似抗锯齿，使边缘更平滑">FXAA</td>
					<td>
						<label style="display: inline-block; margin-right: 20px">
							<input class="fxaaEnabled" type="checkbox" />
						</label>
						<label style="display: inline-block; width: 90px">
							子像素：
							<input
								class="fxaaSubpix"
								type="range"
								value="0.25"
								min="0.0"
								max="1.0"
								step="0.05"
								style="width: 90%; vertical-align: middle"
							/>
						</label>
						<label style="display: inline-block; width: 90px">
							边缘阈值：
							<input
								class="fxaaEdgeThreshold"
								type="range"
								value="0.125"
								min="0.063"
								max="0.333"
								step="0.03"
								style="width: 90%; vertical-align: middle"
							/>
						</label>
					</td>
				</tr>
				<tr>
					<td title="用于风格化画面的卡通渲染效果">卡通</td>
					<td>
						<label style="display: inline-block; margin-right: 20px">
							<input class="cartoonEnabled" type="checkbox" />
						</label>
						<label style="display: inline-block; width: 90px">
							强度：
							<input
								class="cartoonPower"
								type="range"
								value="1.5"
								min="0.1"
								max="9.9"
								step="0.1"
								style="width: 90%; vertical-align: middle"
							/>
						</label>
						<label style="display: inline-block; width: 90px">
							边缘斜率：
							<input
								class="cartoonEdgeSlope"
								type="range"
								value="1.5"
								min="1.5"
								max="5.9"
								step="0.1"
								style="width: 90%; vertical-align: middle"
							/>
						</label>
					</td>
				</tr>
				<tr>
					<td title="提高色彩强度和饱和度">鲜艳度</td>
					<td>
						<label style="display: inline-block; margin-right: 20px">
							<input class="vibranceEnabled" type="checkbox" />
						</label>
						<label style="display: inline-block; width: 200px">
							强度：
							<input
								class="vibrance"
								type="range"
								value="0.15"
								min="-0.9"
								max="0.9"
								step="0.1"
								style="width: 90%; vertical-align: middle"
							/>
						</label>
					</td>
				</tr>
				<tr>
					<td
						title="Hide objects outside the viewing area, enable downsampling rendering and others to improve performance"
					>
						性能模式
					</td>
					<td>
						<label style="display: inline-block; margin-right: 20px">
							<input class="performanceMode" type="checkbox" />
						</label>
						<label style="display: inline-block; width: 200px">
							剔除区域：
							<input
								class="view-area"
								type="range"
								value="14.0"
								min="4.0"
								max="20.0"
								step="1.0"
								style="width: 90%; vertical-align: middle"
							/>
						</label>
					</td>
				</tr>
			</table>

			<div class="reset-section">
				<button class="reset-button">重置为默认值</button>
			</div>
		</div>
	</div>
</div>
