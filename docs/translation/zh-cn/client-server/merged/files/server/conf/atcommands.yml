###########################################################################
# Atcommand Database
###########################################################################
#
# Atcommand Settings
#
###########################################################################
# - Command                  Command name.
#   Aliases:                 Aliases for the command. (Optional)
#     - <AliasName>
#   Help                     Help message for the command. (Optional)
###########################################################################

Header:
  Type: ATCOMMAND_DB
  Version: 1

Body:
  - Command: accept
    Help: |
      接受决斗邀请。
  - Command: accinfo
    Aliases:
      - accountinfo
    Help: |
      参数：<char name>。搜索名称为 <char name> 的角色。可使用 % 作为占位符。
      参数：<account ID>。搜索账号 <account ID> 的登录信息。
      显示账号 ID 为 <account ID> 或包含角色 <char name> 的账号基本信息。
  - Command: addfame
    Aliases:
      - famepoint
      - famepoints
    Help: |
      参数：<amount>。
      增加或减少玩家 <amount> 点声望。
  - Command: addperm
    Help: |
      参数：<permission_name>
      临时为玩家添加权限。
  - Command: addwarp
    Help: |
      参数：<map name> <x coord> <y coord> <NPC name>
  - Command: adjgroup
    Help: |
      参数：<level> <char name>
      临时调整玩家的组等级。
  - Command: adopt
    Help: |
      参数：<char name>
      收养指定玩家 <char name>。
  - Command: agi
    Help: |
      参数：<amount>
      按给定数值提高 AGI。
  - Command: agitend
    Help: |
      结束攻城战
  - Command: agitend2
    Help: |
      结束攻城战 SE
  - Command: agitend3
    Help: |
      结束攻城战 TE
  - Command: agitstart
    Help: |
      开始攻城战
  - Command: agitstart2
    Help: |
      开始攻城战 SE
  - Command: agitstart3
    Help: |
      开始攻城战 TE
  - Command: alive
    Help: |
      从死亡状态复活自己。
  - Command: allowks
    Help: |
      启用或禁用当前地图的抢怪。
  - Command: allskill
    Aliases:
      - allskills
      - skillall
      - skillsall
    Help: |
      给予你全部技能。
  - Command: auction
    Help: |
      打开拍卖窗口。
  - Command: autoloot
    Help: |
      参数：<on|off|#>
      使物品直接进入你的背包。
  - Command: autolootitem
    Aliases:
      - alootid
    Help: |
      参数：无。显示简要帮助。
      参数：+<Item ID> 添加物品 ID
      参数：-<Item ID> 移除物品 ID
      参数：reset 移除所有物品 ID
      使指定物品 ID 的物品直接进入你的背包。
  - Command: autoloottype
    Aliases:
      - aloottype
    Help: |
      参数：无。显示简要帮助。
      参数：+<type name/ID> 添加物品类型
      参数：-<type name/ID> 移除物品类型
      参数：reset 移除所有物品类型
      使指定物品类型的物品直接进入你的背包。
      类型列表：
        healing = 0, usable = 2, etc = 3, weapon = 4, armor = 5,
        card = 6, petegg = 7, petarmor = 8, ammo = 10
  - Command: autotrade
    Aliases:
      - at
    Help: |
      允许你离线摆摊。
  - Command: ban
    Aliases:
      - banish
    Help: |
      参数：<time> <name>\n" "临时封禁账号。
      时间用法：调整值（+/- value）和单位（y/a、m、d/j、h、mn、s）
      示例：@ban +1m-2mn1s-6y testplayer
  - Command: baselevelup
    Aliases:
      - baselevel
      - baselvl
      - baselvup
      - baselvlup
      - blevel
      - blvl
      - lvup
    Help: |
      参数：<number of levels>
      提高指定数量的基础等级。
  - Command: bodystyle
    Help: |
      参数：<job ID>
      参数：off。恢复默认职业体型。
      将角色体型改为 <job ID>。
  - Command: breakguild
    Help: |
      解散当前角色所属的公会。
      你必须是公会会长才能使用此命令。
  - Command: broadcast
    Help: |
      参数：<message>
      以你的名字广播消息（黄色）。
  - Command: camerainfo
    Aliases:
      - viewpointvalue
      - setcamera
    Help: |
      显示或更新客户端摄像机设置。
  - Command: cart
    Help: |
      参数：<cart ID>
      为玩家添加或移除手推车，并更换手推车外观。
      可用手推车 ID：
          0：移除手推车
        1-5：普通手推车
        6-9：新手推车
  - Command: cartlist
    Help: |
      显示手推车中的物品列表。
  - Command: cash
    Help: |
      参数：<amount> - 给予你指定数量的 Cash 点数。
  - Command: changedress
    Aliases:
      - nocosplay
    Help: |
      移除角色的所有时装。
  - Command: changegm
    Help: |
      参数：<charname>
      更换公会会长（你必须是公会会长）。
  - Command: changeleader
    Help: |
      参数：<charname>
      更换队伍队长（你必须是队伍队长）。
  - Command: channel
    Aliases:
      - main
    Help: |
      不带参数运行此命令时，将显示更详细的帮助信息。
  - Command: changecharsex
    Help: |
      更改角色性别。
  - Command: changelook
    Help: |
      参数：<position> <view ID>
      将玩家外观更改为指定的视图 ID。
      可用位置：
        1：头部
        2：中部
        3：下部
        4：武器
        5：盾牌
        6：鞋子
        7：长袍
        8：体型
  - Command: changesex
    Help: |
      更改账号性别。
  - Command: char_ban
    Aliases:
      - charban
    Help: |
      参数：<time> <name>
      临时封禁角色。
      时间用法：调整值（+/- value）和单位（y/a、m、d/j、h、mn、s）
      示例：@char_ban +1m-2mn1s-6y testplayer
  - Command: char_block
    Aliases:
      - block
    Help: |
      参数：<char name>
      永久封禁账号。
  - Command: char_unban
    Aliases:
      - charunban
    Help: |
      参数：<name>
      解封角色。
  - Command: char_unblock
    Aliases:
      - unblock
    Help: |
      参数：<char name>
      解封账号。
  - Command: charcommands
    Help: |
      显示你可以使用的角色命令列表。
  - Command: checkquest
    Help: |
      参数：<quest ID>
      显示任务 ID 为 <quest ID> 的状态信息。
  - Command: clanspy
    Help: |
      参数：<clan name|id>
      你将收到该氏族聊天的所有消息（必须启用聊天记录）。
  - Command: cleanarea
    Aliases:
      - cleararea
    Help: |
      删除视野范围内的地面物品。
  - Command: cleanmap
    Aliases:
      - clearmap
    Help: |
      删除当前地图上的地面物品。
  - Command: clearcart
    Help: |
      删除手推车中的所有物品。
  - Command: cleargstorage
    Help: |
      删除公会仓库中的所有物品。
  - Command: clearstorage
    Help: |
      删除仓库中的所有物品。
  - Command: clearweather
    Help: |
      停止当前地图上的所有天气效果。
  - Command: clone
    Help: |
      参数：<charname>
      生成指定玩家的辅助克隆体。
  - Command: cloneequip
    Aliases:
      - eqclone
    Help: |
      参数：<char name>
      参数：<char ID>
      复制玩家 <char name/char ID> 的装备。
  - Command: clonestat
    Aliases:
      - stclone
    Help: |
      参数：<char name>
      参数：<char ID>
      复制玩家 <char name/char ID> 的属性值。
  - Command: clouds
    Help: |
      使所有地图出现多云天气效果。
  - Command: clouds2
    Help: |
      使所有地图出现另一种多云天气效果。
  - Command: commands
    Help: |
      显示你可以使用的管理员命令列表。
  - Command: completequest
    Help: |
      参数：<quest ID>
      完成任务 ID 为 <quest ID> 的任务。
  - Command: con
    Help: |
      参数：<amount>
      按给定数值提高 CON。
  - Command: costume
    Help: |
      参数：<costume>
      将玩家可见外观更改为所选 <costume>。
      可用时装：
        Hanbok
        Oktoberfest
        Summer
        Wedding
        Xmas
  - Command: crt
    Help: |
      参数：<amount>
      按给定数值提高 CRT。
  - Command: day
    Help: |
      禁用夜间模式并恢复常规光照，所有角色都会受到影响。
  - Command: delitem
    Help: |
      参数：<item name> <amount>
      参数：<item ID> <amount>
      从玩家背包中删除指定物品 <item name/ID> 的 <amount> 个。
  - Command: dex
    Help: |
      参数：<amount>
      按给定数值提高 DEX。
  - Command: disguise
    Help: |
      参数：<monster name|ID>
      将你对其他玩家的外观更改为指定魔物。
  - Command: disguiseall
    Help: |
      参数：<monster name|ID>
      将所有在线角色伪装成指定魔物。
  - Command: disguiseguild
    Help: |
      参数：<monster name|ID>
      将公会中的所有在线角色伪装成指定魔物。
  - Command: displayskill
    Help: |
      参数：<skill ID> {<skill level>}
      显示技能动画，但不会真正使用技能。
  - Command: displayskillcast
    Help: |
      参数：<skill ID> {<skill level> <ground target flag> <cast time>}
      显示技能吟唱动画，但不会真正施放技能。
  - Command: displayskillunit
    Help: |
      参数：<skill unit ID> {<skill level> <range>}
      显示技能单位动画，但不会真正使用技能单位。
  - Command: displaystatus
    Help: |
      参数：<status ID> <flag> <tick> {<val1> <val2> <val3>}
      显示状态变化动画，但不会真正获得该状态变化。
  - Command: divorce
    Help: |
      与玩家离婚。
  - Command: doom
    Help: |
      杀死服务器上所有非 GM 角色。
  - Command: doommap
    Help: |
      杀死地图上所有非 GM 角色。
  - Command: dropall
    Help: |
      参数：[<item type>]
      将你拥有的所有物品丢到地上。不指定类型时会丢弃所有物品。
  - Command: duel
    Help: |
      开始决斗。
  - Command: dye
    Aliases:
      - ccolor
    Help: |
      参数：<clothes palette no.>
      更改角色服装颜色。
  - Command: effect
    Help: |
      参数：<effect id> [<flag>]
      为角色添加效果。
  - Command: email
    Help: |
      参数：<current email> <new email>
      更改账号电子邮箱地址。
  - Command: enchantgradeui
    Help: |
      打开附魔等级界面。
  - Command: erasequest
    Help: |
      参数：<quest ID>
      从任务日志中移除任务 <quest ID>。
  - Command: evilclone
    Help: |
      参数：<charname>
      生成指定玩家的攻击性克隆体。
  - Command: exp
    Help: |
      显示当前等级和百分比进度。
  - Command: fakename
    Help: |
      参数：<name>
      临时将你的名字更改为指定名称。
  - Command: feelreset
    Help: |
      重置星帝标记的地图。
  - Command: fireworks
    Help: |
      使所有地图出现烟花天气效果。
  - Command: fog
    Help: |
      使所有地图出现雾天天气效果。
  - Command: font
    Help: |
      参数：<type> - 取值范围 0-9
      将客户端字体设为 <type>。
      可用类型：
        0：默认
        1: RixLoveangel
        2: RixSquirrel
        3: NHCgogo
        4: RixDiary
        5: RixMiniHeart
        6: RixFreshman
        7: RixKid
        8: RixMagic
        9: RixJJangu
  - Command: fontcolor
    Help: |
      参数：<color_name>
      仅为执行命令的角色设置频道聊天字体颜色。
  - Command: follow
    Help: |
      参数：<char name>
      跟随玩家。
  - Command: fullstrip
    Help: |
      参数：<char name>
      卸下 <char name> 当前装备的所有物品。
  - Command: gat
    Help: |
      用于调试（检查 gat 周围区域）。
  - Command: guildlevelup
    Aliases:
      - glevel
      - glvl
      - guildlevel
      - guildlvl
      - guildlvlup
      - guildlvup
    Help: |
      参数：<级数>
      将公会提高指定数量的等级。
  - Command: gmotd
    Help: |
      向所有玩家广播每日消息。
  - Command: go
    Help: |
      参数：<city name|number>
      将你传送到城市。
      -3: （记忆点 2） 14: louyang         31: mora
      -2: （记忆点 1） 15: start point     32: dewata
      -1: （记忆点 0） 16: prison/jail     33: malangdo island
       0: prontera              17: jawaii             34: malaya port
       1: morocc                18: ayothaya       35: eclage
       2: geffen                  19: einbroch       36: lasagna
       3: payon                  20: lighthalzen
       4: alberta                 21: einbech
       5: izlude                   22: hugel
       6: aldebaran           23: rachel
       7: xmas (lutie)        24: veins
       8: comodo               25: moscovia
       9: yuno                     26: midgard camp
      10: amatsu               27: manuk
      11: gonryun              28: splendide
      12: umbala               29: brasilis
      13: niflheim              30: el dicastes
  - Command: grade
    Help: |
      参数：<equip position> <+/- amount>
  - Command: guild
    Help: |
      参数：<guild_name>
      Create a guild.
  - Command: guildrecall
    Help: |
      Params: <guild name|ID>
      Warps all online characters of a guild to you.
  - Command: guildspy
    Help: |
      Params: <guild name|id>
      You will receive all messages of the guild chat (Chat logging must be enabled)
  - Command: guildstorage
    Aliases:
      - gstorage
    Help: |
      Opens guild storage.
  - Command: gvgoff
    Aliases:
      - gpvpoff
    Help: |
      Disables GvG on the current map
  - Command: gvgon
    Aliases:
      - gpvpon
    Help: |
      Enables GvG on the current map
  - Command: hair_color
    Aliases:
      - haircolor
      - hcolor
    Help: |
      Params <hair palette no.>
      Changes your hair color.
  - Command: hair_style
    Aliases:
      - hairstyle
      - hstyle
    Help: |
      Params: <hairstyle no.>
      Changes your hair style.
  - Command: hatch
    Help: |
      Create a pet from your inventory eggs list.
  - Command: hatereset
    Help: |
      Resets a Star Gladiator's marked monsters.
  - Command: heal
    Help: |
      Params: [<HP> <SP>]
      Heals the desired amount of HP and SP. No value specified will do a full heal.
  - Command: healap
    Help: |
      Params: [<AP>]
      Heals the desired amount of AP. No value specified will do a full AP heal.
  - Command: help
    Aliases:
      - h
    Help: |
      Params: <command>
      Shows help for specified command.
  - Command: hide
    Help: |
      Makes you character invisible (GM invisibility). Type again to become visible.
  - Command: hidenpc
    Help: |
      Params: <NPC name>
      Disable a NPC.
  - Command: homevolution
    Aliases:
      - homevolve
    Help: |
      Evolves your homunculus, if possible.
  - Command: homfriendly
    Help: |
      Params: <level of intimacy> - value between 0-1000
      Sets your homunculus intimacy level to the desired value.
  - Command: homhungry
    Help: |
      Params: <level of hunger> - value between 0-100
      Sets your homunculus hunger level to the desired value.
  - Command: hominfo
    Help: |
      Displays homunculus stats.
  - Command: homlevel
    Aliases:
      - hlvl
      - hlevel
      - homlvl
      - homlvup
    Help: |
      Params: <level>
      Increases the homunculus level by <level>.
  - Command: hommutate
    Help: |
      Params: <mutated homunculus ID>
      Mutates your homunculus to <mutated homunculus ID>, if possible.
  - Command: homshuffle
    Help: |
      Recalculates the homunculus stats, as if the homunculus was leveled again from level 1.
  - Command: homstats
    Help: |
      Displays homunculus stats.
  - Command: homtalk
    Help: |
      Params: <message>
      Let the player's homunculus say the text <message>.
  - Command: identify
    Help: |
      Opens the identification window if any unidentified items are in your inventory.
  - Command: identifyall
    Help: |
      Any unidentified items in your inventory will automatically be identified.
  - Command: idsearch
    Help: |
      Params: <part_of_item_name>
      Search all items that name have part_of_item_name
  - Command: int
    Help: |
      Params: <amount>
      Raises INT by given amount.
  - Command: invite
    Help: |
      Invites a player to a duel.
  - Command: item
    Help: |
      Params: <item name or ID> <quantity>
      Gives you the desired item.
  - Command: item2
    Help: |
      Params: <item name or ID> <quantity> <identified_flag> <refine> <broken_flag> <Card1> <Card2> <Card3> <Card4>
      Gives you the desired item.
  - Command: itembound
    Help: |
      Params: <item name or ID> <quantity> <bound type>
      Creates an item bounded to the character.
      The items cannot be dropped, sold, vended, auctioned, or mailed, and in some cases cannot be traded or stored.
      Available bound types:
        1: Account
        2: Guild
        3: Party
        4: Character
  - Command: itembound2
    Help: |
      Params: <item name or ID> <quantity> <identified_flag> <refine> <broken_flag> <Card1> <Card2> <Card3> <Card4> <bound type>
      Creates an item bounded to the character.
      The items cannot be dropped, sold, vended, auctioned, or mailed, and in some cases cannot be traded or stored.
      Available bound types:
        1: Account
        2: Guild
        3: Party
        4: Character
  - Command: iteminfo
    Aliases:
      - ii
    Help: |
      Params: <item name|ID>
      Shows item info (type, price etc).
  - Command: itemlist
    Aliases:
      - inventorylist
    Help: |
      Displays a list of items in the inventory.
  - Command: itemreset
    Aliases:
      - clearinventory
    Help: |
      Remove all your items.
  - Command: jail
    Help: |
      Params: <char name>
      Sends specified character in jails.
  - Command: jailfor
    Help: |
      Params: <time> <char name>
      Sends specified character in jails for the given <time>.
  - Command: jailtime
    Help: |
      Displays remaining jail time.
  - Command: jobchange
    Aliases:
      - job
