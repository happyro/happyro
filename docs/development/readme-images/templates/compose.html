<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>HappyRO image composition</title>
<style>
*{box-sizing:border-box}body{margin:0;background:transparent}img{display:block;width:100%;height:100%;object-fit:contain}
.hero{position:relative;width:1600px;height:1000px;overflow:hidden;background:transparent}
.monitor{position:absolute;left:420px;top:35px;width:992px;height:776px;padding:14px 14px 38px;background:#25272a;border-radius:19px;border:2px solid #5b6066}
.monitor img{height:720px;border-radius:5px}.monitor:after{content:"";position:absolute;width:7px;height:7px;background:#777d82;border-radius:50%;bottom:14px;left:50%}
.stand{position:absolute;left:846px;top:806px;width:140px;height:94px;background:#a6adb3;clip-path:polygon(15% 0,85% 0,100% 100%,0 100%)}
.foot{position:absolute;left:771px;top:889px;width:290px;height:16px;background:#c1c7cc;border-radius:50% 50% 6px 6px}
.tablet{position:absolute;left:36px;top:440px;width:696px;height:532px;padding:14px 18px;border:2px solid #6b7076;background:#24272a;border-radius:26px}
.tablet img{border-radius:10px}.phone{position:absolute;left:1252px;top:358px;width:300px;height:600px;padding:10px;border:3px solid #626970;background:#202428;border-radius:35px}
.phone img{border-radius:23px}.phone:after{content:"";position:absolute;bottom:15px;left:110px;width:76px;height:4px;border-radius:4px;background:#fff9}
.skills{width:1600px;height:858px;background:transparent;display:flex;align-items:center;justify-content:center;gap:55px;padding:30px}
.skills .wide{position:relative;width:1044px;height:798px;flex:none}.skills .tall{position:relative;width:399px;height:798px;flex:none}
.skills .tablet{left:0;top:0;transform:scale(1.5);transform-origin:top left}
.skills .phone{left:0;top:0;transform:scale(1.33);transform-origin:top left}
</style>
<div class="hero" id="hero">
 <div class="stand"></div><div class="foot"></div>
 <div class="monitor"><img src="desktop.png"></div>
 <div class="tablet"><img src="tablet.png"></div>
 <div class="phone"><img src="phone.png"></div>
</div>
<div class="skills" id="skills"><div class="wide"><div class="tablet"><img src="tablet-skills.png"></div></div><div class="tall"><div class="phone"><img src="phone-skills.png"></div></div></div>
</html>
